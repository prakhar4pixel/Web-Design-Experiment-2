<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prakhar Singh | Developer Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Menu -->
  <nav class="navbar">
    <div class="logo">Prakhar<span>Singh</span></div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <h1>Hi, I'm <span class="highlight">Prakhar Singh</span></h1>
    <p>A Frontend Web Developer crafting simple, fast, and responsive websites.</p>
    <a href="#contact" class="btn">Contact Me</a>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section">
    <h2>Contact Me</h2>
    <form class="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Prakhar Singh. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
